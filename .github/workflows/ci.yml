# Setzt durch, was memory-bank/standards/coding-standards.md fordert:
# "Both formatters are non-negotiable; CI must enforce them."
#
# Bis zum Code-Review vom 2026-09-09 gab es keinen einzigen Workflow — Ruff und
# Black waren konfiguriert, aber nicht einmal installiert.
name: CI

on:
  # Ohne Branch-Filter: Ein Feature-Branch wurde bisher erst geprueft, wenn ein PR
  # aufging — bei einem Repo, das direkt auf main arbeitet, also nie vor dem Landen.
  # Die Pruefung kam damit nach dem Risiko statt davor.
  push:
  pull_request:

# Ein PR aus demselben Repo loest sonst zweimal aus (push und pull_request). Die
# Gruppe bricht den vorigen Lauf desselben Refs ab, statt Minuten doppelt zu zahlen.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Konfiguration bereitstellen
        # Die Settings verlangen DATABASE_URL und JWT_SECRET_KEY ohne Default, und
        # `.env` ist zu Recht nicht im Repo. Die Tests laufen gegen In-Memory-SQLite,
        # brauchen die Werte also nur formal. Der Umweg ueber .env.example prueft
        # nebenbei, ob die Beispieldatei noch vollstaendig ist.
        run: cp .env.example .env

      - name: Ruff
        run: ruff check app tests

      - name: Black
        run: black --check app tests

      - name: Mandantentrennung (statisch)
        # Bricht ab, sobald eine Query auf einer mandantengebundenen Tabelle ohne
        # Filter auftaucht oder ein Endpunkt mit zweiter Kennung die mandant_id
        # nicht durchreicht. Beide Faelle waren in Etappe 1 echte Fehler.
        #
        # Diese Pruefung sieht, *ob* eine mandant_id im Statement vorkommt, nicht ob
        # es die richtige ist. Befund M16 (Stufe 3) war fuer sie deshalb unsichtbar:
        # Die Query trug ihren Filter, was fehlte war eine Validierung. Der Schritt
        # darunter deckt diese Klasse ab.
        # 43 -> 28 in Stufe 5: Der Helfer buchungen_des_mandanten() bringt den
        # Mandantenfilter in acht Abfragen auf JournalLine hinein, die ihn vorher
        # erst danach in Python anwendeten (Befund A1-4). Die Ratsche muss beim
        # Beheben mitsinken, sonst schweigt sie, wenn gleichzeitig einer dazukommt.
        run: python checks/check_tenancy.py --strict --max-offen 28

      - name: Mandantentrennung (Endpunktliste)
        # Die Buchhaltung der Stufe-4-Sonden — laeuft in unter einer Sekunde und
        # eigens, damit ein neuer Endpunkt seinen eigenen Fehlschlag bekommt.
        #
        # Ohne diesen Schritt waere der stillste denkbare Fehler moeglich: Wer einen
        # Endpunkt hinzufuegt, dem eine Kennungsquelle oder ein Rumpf fehlt, hat
        # einfach eine Sonde weniger. Nichts wird rot, die Abdeckung bleibt, und der
        # Endpunkt ist ungeprueft. Diese Tests machen daraus einen benannten
        # Fehlschlag. Die 173 Angriffe selbst laufen im Testschritt darunter mit.
        #
        # Was dieser Schritt nicht sieht: Er fuehrt eine Datei aus, also fehlt ihm
        # alles, was erst im Zusammenspiel auftritt. `tests/auth/test_rbac.py` haengt
        # zum Beispiel beim Import einen eigenen Router an dasselbe `app`-Objekt —
        # dieser Schritt bliebe gruen, der Gesamtlauf darunter wurde rot. Genau das
        # ist beim Bauen von Stufe 4 passiert. Der schnelle benannte Fehlschlag ist
        # das wert, solange der Gesamtlauf im selben Auftrag folgt.
        run: pytest tests/tenancy/test_endpunktliste.py -q --no-cov

      - name: Tests mit Abdeckungsmessung
        # Die Untergrenze steht in pyproject.toml unter [tool.coverage.report] und ist
        # eine Ratsche: Sie darf nur steigen. Sie erzwingt keine Tests, verhindert aber,
        # dass die Abdeckung unbemerkt sinkt.
        run: pytest -q --cov --cov-report=term

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Abhaengigkeiten installieren
        run: npm ci

      - name: Prettier
        run: npm run format:check

      - name: ESLint
        # --max-warnings 21 deckelt die bekannten Altbefunde aus Etappe 0.
        # Die Zahl darf nur sinken; siehe Kommentar in eslint.config.js.
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Tests mit Abdeckungsmessung
        # Grenzen stehen in vitest.config.ts unter test.coverage.thresholds — dieselbe
        # Ratsche wie im Backend.
        run: npm run test:coverage
