[project]
name = "cashflow-backend"
version = "0.1.0"
description = "CashFlow Core – Backend API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.21",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "passlib[bcrypt]>=1.7",
    "python-jose[cryptography]>=3.3",
    "pydantic[email]>=2.0",
    "pydantic-settings>=2.0",
    "structlog>=24.0",
    "bcrypt<4",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "aiosqlite>=0.20",  # in-memory SQLite for tests
    "ruff>=0.14",       # Linter — war konfiguriert, aber nicht installiert
    "black>=25.0",      # Formatter — dito
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 88
# Alembic erzeugt seine Dateien selbst; pyrightconfig.json schliesst sie ebenso aus.
exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP"]
ignore = [
    "E712",  # SQLAlchemy vergleicht Booleans mit == True/False
    # Die Zeilenlaenge gehoert Black. Was nach `black` noch zu lang ist, sind
    # ausschliesslich String-Literale und Kommentare, die Black nicht umbrechen
    # kann — HTML-Mailvorlagen, lange Beschreibungstexte. Ein Umbruch dort bringt
    # keine Lesbarkeit, und 163 unerfuellbare Meldungen wuerden die verdecken,
    # auf die es ankommt.
    "E501",
    # `class X(str, Enum)` nach `StrEnum` zu ziehen aendert das Verhalten von
    # `str(X.a)` von "X.a" zu "a". Solange nicht geprueft ist, wo das durchschlaegt,
    # ist die Umstellung keine reine Modernisierung.
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
# pytest-Fixtures muessen in den Namensraum des Testmoduls importiert werden;
# ruff sieht den gleichnamigen Testparameter als Redefinition.
"tests/**" = ["F811"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
# app/scripts bleibt bewusst drin. Die Einmalskripte auszuschliessen hoebe die Quote
# um zwei Punkte — und wuerde ausgerechnet backfill_booking_references.py verstecken:
# 193 Anweisungen, 0 % geprueft, und es schreibt Buchungsdaten um. Genau das soll die
# Zahl zeigen, nicht verbergen.

[tool.coverage.report]
# Ratsche, keine Zielvorgabe: Der Wert am 2026-09-10 war 66,13 %. Die Grenze darf nur
# steigen. Sie zwingt niemanden, Tests zu schreiben — sie verhindert, dass die
# Abdeckung unbemerkt sinkt. Wer sie senkt, tut das in einem Commit, und das ist
# sichtbar. Dasselbe Muster wie --max-offen bei der Mandantenpruefung.
#
# Was sie nicht leistet: Coverage misst Ausfuehrung, nicht Pruefung. Eine Zeile, die
# ein Test durchlaeuft, ohne etwas zu behaupten, zaehlt als abgedeckt. Die Quote sagt,
# wo gar kein Test hinsieht — nicht, ob die Tests, die hinsehen, etwas taugen.
fail_under = 66
precision = 2
show_missing = false

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "greenlet>=3.3.2",
]
